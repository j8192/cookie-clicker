<html>
    <head>
        <title>
            cookie clicker
        </title>
        <link rel="icon" type="image/x-icon" href="favicon.ico">
        <style>
            body {
                background-color:blue;
                font-family:Arial, Helvetica, sans-serif;
            }
            #cookie {
                bottom:400px;
                position:absolute;
                left:20px;
            }
            #cookies {
                position:absolute;
                top:100px;
                left:0px;
                color:white;
                font-size:100px;
                width:600px;
                text-align:center;
            }
            #upgrades {
                position:absolute;
                right:0;
                top:0;
                height:100px;
                border-radius:10px;
                border-color:brown;
                width:400px;
                border-style:solid;
            }
            #cheatopen {
                right:10;
                bottom:10;
                position:absolute;
                z-index:9999;
            }
            #cheatmenu {
                top:400px;
                left:1250px;
                position:absolute;
                border-radius:10px;
                border-color:black;
                border-style:solid;
            }
            #amount {
                top:0px;
                left:600px;
                border-radius:10px;
                border-color:brown;
                border-style:solid;
                bottom:0px;
                right:400px;
                position:absolute;
                color:white;
                font-size:36px;
            }
            #cpsdiv {
                color:white;
                position:absolute;
                bottom:200px;
                left:20px;
                width:600px;
                text-align:center;
                font-size:75px;
            }
            #messages {
                background-color:black;
                border-color:brown;
                border-radius:10px;
                border-style:solid;
                left:1000px;
                right:1000px;
                bottom:50px;
                height:100px;
                position:absolute;
                box-shadow:10px 10px 100px 0px black;
            }
            #messagetitle {
                color:white;
                font-size:36px;
            }
            #messagediscription {
                color:lightgray;
                font-size:12px;
            }
            .achievment {
                border-color:white;
                border-radius:10px;
                border-style:solid;
                font-size:24px;
            }
            #achievments {
                border-color:brown;
                border-radius:10px;
                border-style:solid;
                color:white;
                position:absolute;
                top:100px;
                bottom:0px;
                right:0px;
                width:400px;
            }
            #achievmentstotal {
                top:10px;
                right:10px;
                font-size:36px;
                color:lightgrey;
                position:absolute;
            }
            #clearachievments {
                bottom:10px;
                position:absolute;
            }
            body.rewarding {
                background: radial-gradient(circle, white 0%, gold 100%);
            }
        </style>
    </head>
    <body>
        <img id="cookie" src="image.png">
        <output id="cookies"></output>
        <div id="upgrades">
            <button id="double">
                double clicks
                <br>
                cost: <output id="doubleCost"></output> cookies
            </button>
            <br>
            <button id="ops" hidden>
                automatic clickers
                <br>
                cost: <output id="opscost"></output> cookies
            </button>
        </div>
        <div id="amount">
            <div id="amountdouble" hidden>
                amount of double clicks: <output id="amountdoublenumber"></output>
            </div>
            <br>
            <div id="amountops" hidden>
                amount of automatic clickers: <output id="amountopsnumber"></output>
            </div>
        </div>
        <button id="cheatopen">
            open debug menu
        </button>
        <div id="cheatmenu" hidden>
            <div id="password">
                password:
                <br>
                <input id="tryme">
                <br>
                <button id="confirm">
                    confirm
                </button>
            </div>
            <div id="cheat" hidden>
                <button id="infinite">
                    infinite cookies
                </button>
                <br>
                <button id="set">
                    set cookies
                </button>
                <br>
                amount to set to:
                <br>
                <input id="setamount">
                <br>
                <button id="close">
                    close
                </button>
            </div>
        </div>
        <div id="cpsdiv"><output id="cps"></output> cookies per second!</div>
        <div id="messages" hidden><output id="messagetitle"></output><br><output id="messagediscription"></output></div>
        <div id="achievments">
            <h1>
                achievments
            </h1>
            <output id="achievmentstotal"></output>
            <br>
            <div class="achievment" id="infiniteachievment" hidden>assending into the unbelievable!</div>
            <br>
            <div class="achievment" id="cheatachievment" hidden>cheated cookies taste awful!</div>
            <br>
            <div class="achievment" id="robber" hidden>caught red handed!</div>
            <br>
            <div class="achievment" id="liner" hidden>double liner!</div>
            <br>
            <div class="achievment" id="broken" hidden>broken finger!</div>
            <br>
            <div class="achievment" id="repaired" hidden>repaired yet?</div>
            <br>
            <div class="achievment" id="breaker" hidden>game breaker!</div>
            <br>
            <button id="clearachievments" hidden>clear achievments</button>
        </div>
        <img id="reward" src="image.svg" width="1000" height="2000" hidden>
        <button id="test" hidden>placeholder</button>
        <script src="game.js"></script>
    </body>
</html>
